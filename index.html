<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Annoncer til godkendelse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --flade:#F6F4EF; --kort:#FFFFFF; --tekst:#36342F; --daempet:#6E6B63; --linje:#E2DED5; --moerk:#36342F;
    --ok:#3E6B48; --ok-lys:#E6EFE7; --ret:#9A6B1E; --ret-lys:#F5ECDD; --nej:#8A2B2B; --nej-lys:#F5E4E2;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--flade); color:var(--tekst); font:15px/1.45 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
  button, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; touch-action:manipulation; }
  :focus-visible { outline:3px solid #A5A195; outline-offset:2px; }
  [hidden] { display:none !important; }

  .app { height:100dvh; width:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr); max-width:520px; margin:0 auto; }
  .top, .scene, .dock { min-width:0; }

  /* top */
  .top { padding:10px 16px 0; }
  .r1 { display:flex; align-items:center; gap:12px; min-height:30px; }
  .r1 img { height:24px; width:auto; }
  .r1 .tael { margin-left:auto; font-size:13px; color:var(--daempet); font-variant-numeric:tabular-nums; }
  .bar { height:3px; background:var(--linje); border-radius:2px; margin-top:10px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--moerk); transition:width .45s var(--ease); }
  .gvaelger { display:flex; align-items:center; gap:8px; width:100%; margin-top:10px; border:1.5px solid var(--linje); background:var(--kort); border-radius:12px; padding:9px 12px; text-align:left; transition:border-color .2s; }
  .gvaelger:hover { border-color:#CFCAC0; }
  .gvaelger b { font-weight:650; font-size:14px; }
  .gvaelger span { color:var(--daempet); font-size:13.5px; }
  .gvaelger em { margin-left:auto; font-style:normal; font-size:13px; color:var(--daempet); font-variant-numeric:tabular-nums; }
  .gvaelger svg { flex:none; width:14px; height:14px; color:var(--daempet); }
  .gliste { display:grid; gap:6px; }
  .gliste button { display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; text-align:left; border:1.5px solid var(--linje); background:#fff; border-radius:12px; padding:11px 13px; transition:border-color .15s, background .15s; }
  .gliste button:hover { border-color:#CFCAC0; }
  .gliste button[aria-current="true"] { border-color:var(--moerk); }
  .gliste b { font-weight:650; font-size:14.5px; }
  .gliste span { color:var(--daempet); font-size:13px; grid-column:1; }
  .gliste em { grid-row:1 / span 2; grid-column:2; font-style:normal; font-size:13px; color:var(--daempet); font-variant-numeric:tabular-nums; }
  .gliste em.alle { color:var(--ok); font-weight:650; }
  .gliste i { grid-column:1 / -1; height:3px; border-radius:2px; background:var(--linje); margin-top:7px; overflow:hidden; }
  .gliste i u { display:block; height:100%; background:var(--moerk); text-decoration:none; }

  /* scene */
  .scene { position:relative; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 16px; gap:10px; }
  .ramme { position:relative; width:100%; display:flex; justify-content:center; align-items:center; flex:1; min-height:0; touch-action:pan-y; container-type:size; }
  .kortet { position:relative; width:min(100cqw, calc((100cqh - 132px) * .8)); border-radius:14px; overflow:hidden; background:#fff; color:#111; border:1px solid var(--linje); box-shadow:0 10px 30px rgba(54,52,47,.12);
    transition:transform .38s var(--ease), opacity .38s var(--ease); will-change:transform, opacity; }
  .kortet.story { width:min(100cqw, 56.25cqh); aspect-ratio:9/16; border:0; background:#111; }
  .ig-hoved { display:flex; align-items:center; gap:9px; padding:8px 11px; height:50px; }
  .ig-av { width:32px; height:32px; border-radius:50%; overflow:hidden; flex:none; background:#D9D5CC; box-shadow:0 0 0 1.5px #fff, 0 0 0 2.5px #E2DED5; }
  .ig-av img { width:100%; height:100%; display:block; object-fit:contain; background:#fff; }
  .ig-navn { line-height:1.15; font-size:13px; } .ig-navn b { font-weight:650; } .ig-navn span { display:block; font-size:11.5px; color:#737373; }
  .ig-prik { margin-left:auto; color:#262626; font-weight:700; letter-spacing:1px; }
  .ig-bill { position:relative; aspect-ratio:4/5; background:#E7E3DA; overflow:hidden; }
  .kortet.story .ig-bill { position:absolute; inset:0; aspect-ratio:auto; }
  .ig-cta { display:flex; justify-content:space-between; align-items:center; height:40px; padding:0 12px; font-weight:600; font-size:13.5px; background:#fff; border-bottom:1px solid #efefef; }
  .ig-ikoner { display:flex; gap:14px; align-items:center; height:42px; padding:0 12px; }
  .ig-ikoner svg { width:22px; height:22px; }
  .ig-ikoner .gem { margin-left:auto; }
  .kortet.story .ig-bill::after { content:''; position:absolute; left:0; right:0; top:0; height:16%; background:linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,0)); z-index:2; pointer-events:none; }
  .kortet.story .ig-hoved { position:absolute; top:12px; left:4px; right:4px; z-index:3; height:auto; }
  .kortet.story .ig-navn, .kortet.story .ig-navn span, .kortet.story .ig-prik { color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .kortet.story .ig-bar { position:absolute; top:6px; left:8px; right:8px; height:2.5px; border-radius:2px; background:rgba(255,255,255,.45); z-index:3; }
  .kortet.story .ig-bar i { display:block; width:35%; height:100%; background:#fff; border-radius:2px; }
  .kortet.story .ig-svar { position:absolute; left:0; right:0; bottom:14px; z-index:3; display:grid; justify-items:center; gap:3px; color:#fff; font-size:12px; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .kortet.story .ig-svar span { background:#fff; color:#111; font-weight:650; font-size:13px; padding:7px 18px; border-radius:999px; text-shadow:none; }
  .ig-bill img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s ease; }
  .ig-bill img.klar, .ig-bill video.klar { opacity:1; }
  .ig-bill video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s ease; background:#000; }
  .lyd { position:absolute; right:10px; bottom:10px; z-index:4; width:30px; height:30px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; display:grid; place-items:center; cursor:pointer; padding:0; }
  .lyd svg { width:16px; height:16px; }
  .kortet.story .lyd { bottom:64px; }
  .kortet .skimmer { position:absolute; inset:0; background:linear-gradient(100deg, #E7E3DA 30%, #EFECE5 50%, #E7E3DA 70%); background-size:200% 100%; animation:skim 1.2s linear infinite; }
  @keyframes skim { to { background-position:-200% 0; } }
  .kortet.ud-venstre { transform:translateX(-110%) rotate(-6deg); opacity:0; }
  .kortet.ud-hoejre { transform:translateX(110%) rotate(6deg); opacity:0; }
  .kortet.ud-op { transform:translateY(-30px) scale(.96); opacity:0; }
  .kortet.ind { transform:scale(.97); opacity:0; transition:none; }

  .maerke { position:absolute; top:12px; left:12px; z-index:2; border-radius:999px; padding:5px 11px; font-size:13px; font-weight:650; display:flex; gap:8px; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .maerke.godkend { background:var(--ok-lys); color:var(--ok); }
  .maerke.ret { background:var(--ret-lys); color:var(--ret); }
  .maerke.afvis { background:var(--nej-lys); color:var(--nej); }
  .maerke button { border:0; background:none; padding:0; font-size:12.5px; font-weight:600; text-decoration:underline; color:inherit; }

  .under { display:flex; align-items:center; gap:10px; width:100%; justify-content:space-between; }
  .format { display:inline-flex; background:#E9E6DE; border-radius:999px; padding:3px; }
  .format button { border:0; background:transparent; font-size:12.5px; font-weight:600; color:var(--daempet); padding:5px 12px; border-radius:999px; transition:background .2s, color .2s; }
  .format button[aria-pressed="true"] { background:var(--kort); color:var(--tekst); box-shadow:0 1px 2px rgba(54,52,47,.12); }
  .nav { display:flex; gap:6px; }
  .nav button { width:36px; height:36px; border-radius:50%; border:1.5px solid var(--linje); background:var(--kort); font-size:17px; line-height:1; color:var(--daempet); }

  /* dock */
  .dock { padding:10px 16px calc(12px + env(safe-area-inset-bottom)); display:grid; gap:8px; }
  .valg { display:grid; grid-template-columns:1fr 1fr 1.6fr; gap:8px; }
  .valg button { border:1.5px solid var(--linje); background:var(--kort); border-radius:14px; padding:14px 6px; font-weight:650; font-size:15px; transition:transform .12s ease; }
  .valg button:active { transform:scale(.96); }
  .valg .godkend { background:var(--ok); border-color:var(--ok); color:#fff; }
  .valg .ret { color:var(--ret); }
  .valg .afvis { color:var(--nej); }
  .sendknap { border:0; background:var(--moerk); color:#fff; font-weight:650; border-radius:14px; padding:14px; font-size:15px; }
  .sendknap:disabled { opacity:.55; cursor:default; }

  /* ark */
  .skygge { position:fixed; inset:0; z-index:40; background:rgba(30,28,24,.35); opacity:0; transition:opacity .25s; }
  .skygge.vis { opacity:1; }
  .ark { position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--kort); border-radius:20px 20px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; box-shadow:0 -8px 30px rgba(0,0,0,.15); transform:translateY(100%); transition:transform .32s var(--ease); }
  .ark.vis { transform:none; }
  .ark .greb { width:36px; height:4px; border-radius:2px; background:var(--linje); margin:0 auto 12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chips button { border:1.5px solid var(--linje); background:#fff; border-radius:999px; padding:8px 13px; font-size:14px; transition:background .15s, border-color .15s; }
  .chips button[aria-pressed="true"] { border-color:var(--ret); background:var(--ret-lys); color:var(--ret); font-weight:600; }
  .ark textarea { width:100%; min-height:84px; border:1.5px solid var(--linje); border-radius:12px; padding:10px 12px; resize:none; font-size:16px; }
  .ark .knapper { display:grid; grid-template-columns:1fr 2fr; gap:8px; margin-top:10px; }
  .ark .knapper button { border-radius:14px; padding:13px; font-weight:650; border:1.5px solid var(--linje); background:#fff; }
  .ark .knapper .gem { background:var(--ret); border-color:var(--ret); color:#fff; }
  .ark .knapper .gem:disabled { opacity:.5; cursor:default; }

  /* faerdig */
  .faerdig { width:100%; align-self:center; display:grid; gap:12px; }
  .tal { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tal div { border-radius:14px; padding:14px 12px; text-align:center; font-size:13px; }
  .tal b { display:block; font-size:30px; line-height:1.1; font-variant-numeric:tabular-nums; }
  .tal .godkend { background:var(--ok-lys); color:var(--ok); } .tal .ret { background:var(--ret-lys); color:var(--ret); } .tal .afvis { background:var(--nej-lys); color:var(--nej); }
  .tak { text-align:center; font-weight:600; color:var(--ok); min-height:22px; }
  .linkknap { border:0; background:none; color:var(--daempet); text-decoration:underline; padding:6px; justify-self:center; }

  .laeser, .fejl { height:100dvh; display:grid; place-items:center; padding:24px; text-align:center; color:var(--daempet); }
  .fejl div { background:var(--nej-lys); color:var(--nej); border-radius:12px; padding:14px 16px; max-width:420px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div id="app"><div class="laeser">Henter dine annoncer…</div></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwkwR3CmhXosKJdurlSGU6qez9QPUMZDjan8XRtgwWRGRdUuttxj9iSgRPU55NPaWpP/exec';
const QS = new URLSearchParams(location.search);
const B = QS.get('b'), K = QS.get('k');
const LAGER = 'pb-godkend-' + B;
const RET_CHIPS = ['Lyset', 'Teksten', 'Prisen', 'Huden', 'Personen', 'Logoet', 'Beskæringen'];
const NAVN = { godkend:'Godkendt', ret:'Rettes', afvis:'Afvist' };
const SERVER = { 'Godkendt':'godkend', 'Til rettelse':'ret', 'Afvist':'afvis' };
const ROLIG = matchMedia('(prefers-reduced-motion: reduce)').matches;

const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D, alle = [], pos = 0, format = 'feed', faerdig = false, travl = false;
const svar = {}, sendt = {}, billeder = {}, venter = {};

async function api(params) {
  const r = await fetch(API + '?' + new URLSearchParams(params), { credentials:'omit' });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'fejl'); return j;
}
async function post(body) {
  const r = await fetch(API, { method:'POST', credentials:'omit', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(body) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'fejl'); return j;
}
function tilUrl(d) {
  if (!d || !/^data:video\//.test(d)) return d;
  try { const [h, b64] = d.split(','), bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return URL.createObjectURL(new Blob([u8], { type: h.slice(5, h.indexOf(';')) })); } catch (e) { return d; }
}
function billede(id) {
  if (!id) return Promise.resolve(null);
  if (billeder[id]) return Promise.resolve(billeder[id]);
  if (!venter[id]) venter[id] = api({ api:'billede', b:B, k:K, id }).then(j => (billeder[id] = tilUrl(j.url))).catch(() => { delete venter[id]; return null; });
  return venter[id];
}
const idFor = (a, f) => f === 'story' ? a.story : a.feed;
function forhent() { for (let i = 1; i <= 3; i++) { const a = alle[(pos + i) % alle.length]; if (a) billede(idFor(a, format)); } }

if (!B || !K) app.innerHTML = '<div class="fejl"><div>Linket mangler en del. Skriv til os, så sender vi et nyt.</div></div>';
else api({ api:'batch', b:B, k:K }).then(j => start(j.data)).catch(() => {
  app.innerHTML = '<div class="fejl"><div>Annoncerne kunne ikke hentes. Tjek din forbindelse, og genindlæs siden.</div></div>';
});

function start(data) {
  D = data;
  D.grupper.forEach((g, gi) => g.annoncer.forEach((a, i) => alle.push(Object.assign({}, a, { gi, g, i }))));
  Object.keys(D.svar || {}).forEach(fil => {
    const v = SERVER[D.svar[fil].beslutning];
    if (v) { svar[fil] = { beslutning:v, rettelse:D.svar[fil].rettelse || '' }; sendt[fil] = JSON.stringify(svar[fil]); }
  });
  try { Object.assign(svar, JSON.parse(localStorage.getItem(LAGER) || '{}')); } catch (e) {}
  const f = alle.findIndex(a => !svar[a.fil]); pos = f < 0 ? 0 : f; faerdig = f < 0;
  app.innerHTML = `<div class="app">
    <header class="top">
      <div class="r1"><img id="logo" alt="${esc(D.klinik)}" hidden><span class="tael" id="tael"></span></div>
      <div class="bar"><i id="barfyld"></i></div>
      <button class="gvaelger" id="gvaelger" aria-haspopup="dialog"></button>
    </header>
    <section class="scene" id="scene"></section>
    <footer class="dock" id="dock"></footer>
  </div><div id="arkholder"></div>`;
  billede(D.logo).then(u => { if (u) { $('logo').src = u; $('logo').hidden = false; } });
  tegn();
}

function gem() {
  const k = {}; Object.keys(svar).forEach(f => { if (JSON.stringify(svar[f]) !== sendt[f]) k[f] = svar[f]; });
  try { localStorage.setItem(LAGER, JSON.stringify(k)); } catch (e) {}
}
const aendringer = () => Object.keys(svar).filter(f => JSON.stringify(svar[f]) !== sendt[f]);

/* ---------- tegning ---------- */

function tegn() {
  topbar();
  if (faerdig) return tegnFaerdig();
  $('scene').innerHTML = `
    <div class="ramme" id="ramme"><div class="kortet ${format}" id="kortet">${kortIndhold()}</div></div>
    <div class="under">
      <div class="format" role="group" aria-label="Format">
        <button data-f="feed" aria-pressed="${format === 'feed'}">Feed</button>
        <button data-f="story" aria-pressed="${format === 'story'}">Story</button>
      </div>
      <div class="nav"><button id="forrige" aria-label="Forrige annonce">‹</button><button id="naeste" aria-label="Næste annonce">›</button></div>
    </div>`;
  $('dock').innerHTML = `<div class="valg">
      <button class="afvis" data-v="afvis">Afvis</button>
      <button class="ret" data-v="ret">Ret</button>
      <button class="godkend" data-v="godkend">Godkend</button></div>
    <button class="sendknap" id="sendknap" hidden></button>`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { if (format === b.dataset.f) return; format = b.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('kortet').classList.toggle('story', format === 'story'); $('kortet').innerHTML = kortIndhold(); visAnnonce(); });
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => beslut(b.dataset.v));
  $('forrige').onclick = () => gaaTil((pos - 1 + alle.length) % alle.length, 'hoejre');
  $('naeste').onclick = () => gaaTil((pos + 1) % alle.length, 'venstre');
  $('sendknap').onclick = send;
  swipe($('ramme'));
  visAnnonce();
}

const IKON = {
  hjerte:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  boble:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-11.8 7.7L3 21l1.9-6.2A8.4 8.4 0 1 1 21 11.5z"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
  gem:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
};
function kortIndhold() {
  const hoved = `<div class="ig-hoved"><div class="ig-av"><img class="av" alt=""></div><div class="ig-navn"><b>${esc(D.handle)}</b><span>Sponsoreret</span></div><span class="ig-prik">···</span></div>`;
  const bill = `<div class="ig-bill" id="igbill"><div class="skimmer"></div><img id="hb" alt=""><video id="hv" muted loop playsinline preload="auto" hidden></video><button class="lyd" id="lyd" hidden aria-label="Slå lyd til"></button></div>`;
  if (format === 'story') return `${bill}<div class="ig-bar"><i></i></div>${hoved}<div class="ig-svar">︿<span>Book nu</span></div>`;
  return `${hoved}${bill}<div class="ig-cta"><span>Book nu</span><span>›</span></div>
    <div class="ig-ikoner">${IKON.hjerte}${IKON.boble}${IKON.send}<span class="gem">${IKON.gem}</span></div>`;
}

function visAnnonce() {
  const a = alle[pos], s = svar[a.fil], k = $('igbill');
  const gl = k.querySelector('.maerke'); if (gl) gl.remove();
  if (s) {
    const m = document.createElement('div');
    m.className = 'maerke ' + s.beslutning;
    m.innerHTML = `${NAVN[s.beslutning]}${s.beslutning === 'ret' ? '<button data-a="aendr">Ændr</button>' : ''}<button data-a="fortryd">Fortryd</button>`;
    k.appendChild(m);
    m.querySelector('[data-a="fortryd"]').onclick = () => { delete svar[a.fil]; gem(); visAnnonce(); topbar(); };
    const ae = m.querySelector('[data-a="aendr"]'); if (ae) ae.onclick = () => aabnArk(a);
  }
  billede(D.avatar).then(u => { if (u) document.querySelectorAll('img.av').forEach(i => i.src = u); });
  visBillede(); topbar(); forhent();
}

const LYD = { fra:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6"/></svg>', til:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>' };
let lydTil = false;
function visBillede() {
  const a = alle[pos], id = idFor(a, format), img = $('hb'), vid = $('hv'), lyd = $('lyd');
  const erVideo = !!a[format + '_video'];
  img.classList.remove('klar'); vid.classList.remove('klar');
  img.hidden = erVideo; vid.hidden = !erVideo; lyd.hidden = !erVideo;
  vid.pause(); vid.removeAttribute('src');
  const navn = `${a.g.navn}, ${a.g.slags.toLowerCase()}, nr. ${a.nr}`;
  img.alt = navn; vid.setAttribute('aria-label', navn);
  if (erVideo) {
    vid.muted = !lydTil; lyd.innerHTML = lydTil ? LYD.til : LYD.fra;
    lyd.onclick = e => { e.stopPropagation(); lydTil = !lydTil; vid.muted = !lydTil; lyd.innerHTML = lydTil ? LYD.til : LYD.fra; lyd.setAttribute('aria-label', lydTil ? 'Slå lyd fra' : 'Slå lyd til'); };
  }
  billede(id).then(u => {
    if (!u || alle[pos] !== a || idFor(a, format) !== id) return;
    if (erVideo) {
      vid.onloadeddata = () => vid.classList.add('klar');
      vid.src = u; vid.play().catch(() => { vid.muted = true; lydTil = false; lyd.innerHTML = LYD.fra; vid.play().catch(() => {}); });
    } else { img.onload = () => img.classList.add('klar'); img.src = u; if (img.complete) img.classList.add('klar'); }
  });
}

function topbar() {
  const n = alle.filter(a => svar[a.fil]).length;
  $('tael').textContent = `${n}/${alle.length}`;
  $('barfyld').style.width = (100 * n / alle.length) + '%';
  const g = faerdig ? null : alle[pos].g, gm = g ? g.annoncer.filter(a => svar[a.fil]).length : 0;
  $('gvaelger').innerHTML = g
    ? `<b>${esc(g.navn)}</b><span>${esc(g.slags.toLowerCase())}</span><em>${gm}/${g.annoncer.length}</em><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>`
    : `<b>Alle grupper</b><em>${D.grupper.length}</em><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg>`;
  $('gvaelger').onclick = aabnGrupper;
  const sk = $('sendknap'), nye = aendringer().length;
  if (sk) { sk.hidden = !nye; sk.textContent = `Send ${nye} svar`; }
}

/* ---------- bevaegelse ---------- */

function gaaTil(ny, retning, ud) {
  if (travl || ny === pos) return;
  const k = $('kortet');
  if (ROLIG || !k) { pos = ny; return faerdig ? tegn() : visAnnonce(); }
  travl = true;
  k.classList.add(ud || ('ud-' + retning));
  setTimeout(() => {
    pos = ny;
    k.classList.remove('ud-venstre', 'ud-hoejre', 'ud-op'); k.classList.add('ind');
    visAnnonce();
    requestAnimationFrame(() => requestAnimationFrame(() => { k.classList.remove('ind'); travl = false; }));
  }, 260);
}

function swipe(el) {
  let x0 = null, y0 = 0, dx = 0;
  el.addEventListener('touchstart', e => { if (travl) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; }, { passive:true });
  el.addEventListener('touchmove', e => {
    if (x0 === null) return;
    dx = e.touches[0].clientX - x0; const dy = e.touches[0].clientY - y0;
    if (Math.abs(dy) > Math.abs(dx)) return;
    const k = $('kortet'); k.style.transition = 'none'; k.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
  }, { passive:true });
  el.addEventListener('touchend', () => {
    if (x0 === null) return; x0 = null;
    const k = $('kortet'); k.style.transition = ''; k.style.transform = '';
    if (dx < -60) gaaTil((pos + 1) % alle.length, 'venstre');
    else if (dx > 60) gaaTil((pos - 1 + alle.length) % alle.length, 'hoejre');
  });
}

/* ---------- beslutninger ---------- */

function beslut(v) {
  if (travl) return;
  const a = alle[pos];
  if (v === 'ret') return aabnArk(a);
  svar[a.fil] = { beslutning:v, rettelse:'' }; gem();
  videre(v === 'godkend' ? 'ud-op' : 'ud-venstre');
}

function videre(ud) {
  const n = alle.length;
  for (let i = 1; i <= n; i++) { const j = (pos + i) % n; if (!svar[alle[j].fil]) return gaaTil(j, 'venstre', ud); }
  const k = $('kortet');
  if (k && !ROLIG) { k.classList.add(ud || 'ud-op'); setTimeout(() => { faerdig = true; tegn(); }, 260); }
  else { faerdig = true; tegn(); }
}

function aabnArk(a) {
  const s = svar[a.fil] && svar[a.fil].beslutning === 'ret' ? svar[a.fil].rettelse : '';
  let chipDel = '', tekstDel = s;
  const m = s.match(/^([^:]+):\s*([\s\S]*)$/), erChips = x => x.split(', ').every(c => RET_CHIPS.includes(c));
  if (m && erChips(m[1])) { chipDel = m[1]; tekstDel = m[2]; } else if (s && erChips(s)) { chipDel = s; tekstDel = ''; }
  const valgte = new Set(chipDel ? chipDel.split(', ') : []);
  const h = $('arkholder');
  h.innerHTML = `<div class="skygge" id="skygge"></div>
    <div class="ark" id="ark" role="dialog" aria-modal="true" aria-label="Hvad skal rettes">
      <div class="greb"></div>
      <div class="chips">${RET_CHIPS.map(c => `<button data-c="${c}" aria-pressed="${valgte.has(c)}">${c}</button>`).join('')}</div>
      <textarea id="rettekst" placeholder="Hvad skal ændres?">${esc(tekstDel)}</textarea>
      <div class="knapper"><button id="annuller">Annuller</button><button class="gem" id="gemret">Gem rettelse</button></div>
    </div>`;
  requestAnimationFrame(() => { $('skygge').classList.add('vis'); $('ark').classList.add('vis'); });
  const ta = $('rettekst'), gk = $('gemret');
  const opd = () => { gk.disabled = !ta.value.trim() && !h.querySelector('[aria-pressed="true"]'); };
  h.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); opd(); });
  ta.oninput = opd; opd();
  const luk = cb => { $('skygge').classList.remove('vis'); $('ark').classList.remove('vis'); setTimeout(() => { h.innerHTML = ''; if (cb) cb(); }, ROLIG ? 0 : 260); };
  $('annuller').onclick = () => luk(); $('skygge').onclick = () => luk();
  document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { document.removeEventListener('keydown', esc); luk(); } });
  gk.onclick = () => {
    const chips = [...h.querySelectorAll('[aria-pressed="true"]')].map(b => b.dataset.c), t = ta.value.trim();
    svar[a.fil] = { beslutning:'ret', rettelse:(chips.length ? chips.join(', ') + (t ? ': ' : '') : '') + t }; gem();
    luk(() => videre('ud-venstre'));
  };
}

function aabnGrupper() {
  const h = $('arkholder');
  h.innerHTML = `<div class="skygge" id="skygge"></div>
    <div class="ark" id="ark" role="dialog" aria-modal="true" aria-label="Vælg gruppe">
      <div class="greb"></div>
      <div class="gliste">${D.grupper.map((g, gi) => {
        const m = g.annoncer.filter(a => svar[a.fil]).length, n = g.annoncer.length;
        return `<button data-g="${gi}" aria-current="${!faerdig && alle[pos].gi === gi}"><b>${esc(g.navn)}</b><span>${esc(g.slags)}</span>
          <em class="${m === n ? 'alle' : ''}">${m === n ? 'Færdig' : m + '/' + n}</em><i><u style="width:${100 * m / n}%"></u></i></button>`;
      }).join('')}</div>
    </div>`;
  requestAnimationFrame(() => { $('skygge').classList.add('vis'); $('ark').classList.add('vis'); });
  const luk = cb => { $('skygge').classList.remove('vis'); $('ark').classList.remove('vis'); setTimeout(() => { h.innerHTML = ''; if (cb) cb(); }, ROLIG ? 0 : 260); };
  $('skygge').onclick = () => luk();
  document.addEventListener('keydown', function e1(e) { if (e.key === 'Escape') { document.removeEventListener('keydown', e1); luk(); } });
  h.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const gi = +b.dataset.g, i = alle.findIndex(a => a.gi === gi && !svar[a.fil]);
    const maal = i >= 0 ? i : alle.findIndex(a => a.gi === gi);
    luk(() => { if (faerdig) { faerdig = false; pos = maal; tegn(); } else gaaTil(maal, maal > pos ? 'venstre' : 'hoejre'); });
  });
}

/* ---------- faerdig og send ---------- */

function tegnFaerdig(tak) {
  const t = v => alle.filter(a => svar[a.fil] && svar[a.fil].beslutning === v).length;
  const nye = aendringer().length, mangler = alle.filter(a => !svar[a.fil]).length;
  $('scene').innerHTML = `<div class="faerdig">
    <div class="tal"><div class="godkend"><b>${t('godkend')}</b>godkendt</div><div class="ret"><b>${t('ret')}</b>rettes</div><div class="afvis"><b>${t('afvis')}</b>afvist</div></div>
    <div class="tak" id="tak">${tak || (!nye && !mangler ? 'Tak. Vi har dine svar.' : mangler ? `${mangler} mangler et svar` : '')}</div>
    <button class="linkknap" id="igen">Se annoncerne igen</button></div>`;
  $('dock').innerHTML = nye ? `<button class="sendknap" id="sendknap">Send ${nye} svar</button>` : '';
  if (nye) $('sendknap').onclick = send;
  $('igen').onclick = () => { faerdig = false; const f = alle.findIndex(a => !svar[a.fil]); pos = f < 0 ? 0 : f; tegn(); };
}

function send() {
  const k = $('sendknap'), liste = aendringer().map(fil => { const a = alle.find(x => x.fil === fil);
    return { gruppe:`${a.g.navn}, ${a.g.slags.toLowerCase()}`, nr:a.nr, fil, beslutning:svar[fil].beslutning, rettelse:svar[fil].rettelse }; });
  if (!liste.length) return;
  k.disabled = true; k.textContent = 'Sender…';
  post({ action:'svar', b:B, k:K, liste }).then(() => {
    liste.forEach(s => sendt[s.fil] = JSON.stringify(svar[s.fil])); gem();
    if (faerdig) tegnFaerdig('Tak. Vi har dine svar.'); else topbar();
  }).catch(() => { k.disabled = false; k.textContent = 'Prøv at sende igen'; });
}
</script>
