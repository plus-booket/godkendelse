<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Annoncer til godkendelse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --flade:#F6F4EF; --kort:#FFFFFF; --tekst:#36342F; --daempet:#6E6B63; --greige:#A5A195; --linje:#E2DED5; --moerk:#36342F;
    --ok:#3E6B48; --ok-lys:#E6EFE7; --ret:#9A6B1E; --ret-lys:#F5ECDD; --nej:#8A2B2B; --nej-lys:#F5E4E2;
    --dock-h: 88px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--flade); color:var(--tekst); font:15px/1.5 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  button, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:3px solid var(--greige); outline-offset:2px; }
  .serif { font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; }
  [hidden] { display:none !important; }

  /* topbar */
  .top { position:sticky; top:0; z-index:20; background:rgba(246,244,239,.94); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--linje); }
  .top .ind { max-width:1120px; margin:0 auto; padding:10px 16px 0; display:flex; align-items:center; gap:14px; }
  .top img.logo { height:26px; width:auto; }
  .top .titel { font-size:20px; line-height:1.1; }
  .top .fremdrift { margin-left:auto; font-size:13px; color:var(--daempet); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .bar { height:3px; background:var(--linje); margin-top:10px; }
  .bar i { display:block; height:100%; background:var(--moerk); width:0; transition:width .3s ease; }

  .grupper { max-width:1120px; margin:0 auto; padding:12px 16px 2px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  .grupper::-webkit-scrollbar { display:none; }
  .gruppe { flex:none; border:1.5px solid var(--linje); background:var(--kort); border-radius:999px; padding:7px 14px; font-size:13.5px; font-weight:600; white-space:nowrap; }
  .gruppe small { font-weight:500; color:var(--daempet); margin-left:6px; font-variant-numeric:tabular-nums; }
  .gruppe[aria-current="true"] { background:var(--moerk); border-color:var(--moerk); color:#fff; }
  .gruppe[aria-current="true"] small { color:#D9D6CE; }

  main { max-width:1120px; margin:0 auto; padding:14px 16px calc(var(--dock-h) + 40px); display:grid; grid-template-columns:minmax(0,1fr); gap:18px; }
  .venstre, .info { min-width:0; }
  @media (min-width:900px) {
    main { grid-template-columns:minmax(0,420px) minmax(0,1fr); gap:40px; padding-top:22px; }
    .venstre { position:sticky; top:calc(var(--hh, 140px) + 16px); align-self:start; }
  }

  .hvilken { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .hvilken h1 { margin:0; font-size:24px; line-height:1.1; }
  .hvilken .nr { font-size:13px; color:var(--daempet); white-space:nowrap; }
  .format { display:inline-flex; background:#E9E6DE; border-radius:999px; padding:3px; margin-bottom:10px; }
  .format button { border:0; background:transparent; font-size:12.5px; font-weight:600; color:var(--daempet); padding:5px 12px; border-radius:999px; }
  .format button[aria-pressed="true"] { background:var(--kort); color:var(--tekst); box-shadow:0 1px 2px rgba(54,52,47,.12); }

  .scene { position:relative; max-width:420px; }
  .post { background:#fff; border:1px solid var(--linje); border-radius:12px; overflow:hidden; color:#111; }
  .post .hoved { display:flex; align-items:center; gap:10px; padding:9px 12px; }
  .avatar { width:32px; height:32px; border-radius:50%; overflow:hidden; flex:none; background:var(--greige); }
  .avatar img { width:100%; height:100%; display:block; object-fit:cover; }
  .hvem { line-height:1.2; } .hvem b { font-size:13.5px; font-weight:650; } .hvem span { display:block; font-size:12px; color:#65676b; }
  .billede { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; background:#E7E3DA; }
  .cta { display:flex; justify-content:space-between; padding:10px 12px; font-weight:600; font-size:13.5px; border-top:1px solid #efefef; }
  .story { position:relative; aspect-ratio:9/16; max-height:72vh; border-radius:16px; overflow:hidden; background:#E7E3DA; margin:0 auto; }
  .story img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .story .hoved { position:absolute; top:14px; left:10px; right:10px; display:flex; align-items:center; gap:8px; }
  .story .hvem b, .story .hvem span { color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.55); }

  /* stempel paa den valgte annonce */
  .stempel { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; font-size:14px; margin-bottom:10px; max-width:420px; }
  .stempel.godkend { background:var(--ok-lys); color:var(--ok); }
  .stempel.ret { background:var(--ret-lys); color:var(--ret); }
  .stempel.afvis { background:var(--nej-lys); color:var(--nej); }
  .stempel b { font-weight:700; }
  .stempel .t { flex:1; min-width:0; color:var(--tekst); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stempel button { border:0; background:none; text-decoration:underline; font-size:13px; color:inherit; padding:0; }

  .strip { display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:thin; max-width:420px; }
  .tn { position:relative; flex:none; width:58px; border:0; padding:0; background:none; }
  .tn span.r { display:block; width:58px; aspect-ratio:4/5; border-radius:7px; background:#E7E3DA center/cover no-repeat; border:2px solid transparent; }
  .tn[aria-current="true"] span.r { border-color:var(--moerk); }
  .tn em { display:block; font-style:normal; font-size:11.5px; color:var(--daempet); margin-top:2px; text-align:center; }
  .prik { position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; }
  .prik.godkend { background:var(--ok); } .prik.ret { background:var(--ret); } .prik.afvis { background:var(--nej); }

  /* hoejre kolonne */
  .info { display:grid; gap:14px; align-content:start; }
  .kort { background:var(--kort); border:1px solid var(--linje); border-radius:14px; padding:14px 16px; }
  .kort h2 { margin:0 0 6px; font-size:15px; font-family:inherit; font-weight:700; }
  .linjer { margin:0; padding:0; list-style:none; }
  .linjer li { padding:4px 0; border-top:1px solid var(--linje); font-size:14px; }
  .linjer li:first-child { border-top:0; }
  .rolig { font-size:13.5px; color:var(--daempet); }
  .rolig p { margin:6px 0 0; }
  .genvej { font-size:12.5px; color:var(--daempet); }
  .genvej kbd { font:inherit; font-weight:600; border:1px solid var(--linje); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:#fff; color:var(--tekst); }
  @media (max-width:899px) { .genvej { display:none; } }

  /* dock */
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--kort); border-top:1px solid var(--linje); box-shadow:0 -6px 20px rgba(54,52,47,.08); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .dock .ind { max-width:560px; margin:0 auto; display:grid; gap:8px; }
  .valg { display:grid; grid-template-columns:1fr 1fr 1.6fr; gap:8px; }
  .valg button { border:1.5px solid var(--linje); background:#fff; border-radius:12px; padding:13px 6px; font-weight:650; font-size:15px; }
  .valg .godkend { background:var(--ok); border-color:var(--ok); color:#fff; }
  .valg .ret { color:var(--ret); }
  .valg .afvis { color:var(--nej); }
  .send { display:flex; align-items:center; gap:10px; }
  .send span { flex:1; font-size:13.5px; color:var(--daempet); }
  .send button { border:0; background:var(--moerk); color:#fff; font-weight:650; border-radius:999px; padding:10px 18px; }
  .send button:disabled { opacity:.5; cursor:default; }

  /* ark til rettelser */
  .skygge { position:fixed; inset:0; z-index:40; background:rgba(30,28,24,.35); }
  .ark { position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--kort); border-radius:18px 18px 0 0; padding:18px 16px calc(16px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; box-shadow:0 -8px 30px rgba(0,0,0,.15); }
  @media (min-width:900px) { .ark { bottom:24px; border-radius:18px; } }
  .ark h2 { margin:0 0 4px; font-size:22px; }
  .ark .hvad { font-size:13.5px; color:var(--daempet); margin-bottom:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chips button { border:1.5px solid var(--linje); background:#fff; border-radius:999px; padding:7px 12px; font-size:13.5px; }
  .chips button[aria-pressed="true"] { border-color:var(--ret); background:var(--ret-lys); color:var(--ret); font-weight:600; }
  .ark textarea { width:100%; min-height:96px; border:1.5px solid var(--linje); border-radius:12px; padding:10px 12px; resize:vertical; }
  .ark .knapper { display:grid; grid-template-columns:1fr 2fr; gap:8px; margin-top:12px; }
  .ark .knapper button { border-radius:12px; padding:12px; font-weight:650; border:1.5px solid var(--linje); background:#fff; }
  .ark .knapper .gem { background:var(--ret); border-color:var(--ret); color:#fff; }
  .ark .knapper .gem:disabled { opacity:.5; cursor:default; }

  /* faerdig */
  .faerdig { text-align:left; }
  .faerdig h1 { font-size:34px; margin:0 0 8px; line-height:1.05; }
  .tal { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
  .tal div { flex:1; min-width:90px; border-radius:12px; padding:10px 12px; }
  .tal b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .tal .godkend { background:var(--ok-lys); color:var(--ok); } .tal .ret { background:var(--ret-lys); color:var(--ret); } .tal .afvis { background:var(--nej-lys); color:var(--nej); }

  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--dock-h) + 30px); z-index:50; background:var(--moerk); color:#fff; padding:9px 16px; border-radius:999px; font-size:13.5px; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  .toast.vis { opacity:1; }
  .laeser { min-height:60vh; display:grid; place-items:center; color:var(--daempet); }
  .fejl { max-width:560px; margin:40px auto; background:var(--nej-lys); color:var(--nej); border-radius:12px; padding:14px 16px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div id="app"><div class="laeser">Henter dine annoncer…</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwkwR3CmhXosKJdurlSGU6qez9QPUMZDjan8XRtgwWRGRdUuttxj9iSgRPU55NPaWpP/exec';
const QS = new URLSearchParams(location.search);
const B = QS.get('b'), K = QS.get('k');
const LAGER = 'pb-godkend-' + B;
const RET_CHIPS = ['Lyset', 'Teksten', 'Prisen', 'Huden', 'Personen', 'Logoet', 'Beskæringen'];
const NAVN = { godkend:'Godkendt', ret:'Rettes', afvis:'Afvist' };
const SERVER = { 'Godkendt':'godkend', 'Til rettelse':'ret', 'Afvist':'afvis' };

const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D, alle = [], pos = 0, format = 'feed', faerdigVist = false;
const svar = {}, sendt = {}, billeder = {}, venter = {};

async function api(params) {
  const r = await fetch(API + '?' + new URLSearchParams(params), { credentials:'omit' });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'fejl'); return j;
}
async function post(body) {
  const r = await fetch(API, { method:'POST', credentials:'omit', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(body) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'fejl'); return j;
}
function billede(id, cb) {
  if (!id) return;
  if (billeder[id]) return cb(billeder[id]);
  if (venter[id]) return venter[id].push(cb);
  venter[id] = [cb];
  api({ api:'billede', b:B, k:K, id }).then(j => { billeder[id] = j.url; venter[id].forEach(f => f(j.url)); delete venter[id]; }).catch(() => delete venter[id]);
}
function forhent(i) { const a = alle[i]; if (a) { billede(a.feed, () => {}); } }

if (!B || !K) app.innerHTML = '<div class="fejl">Linket mangler en del. Skriv til os, så sender vi et nyt.</div>';
else api({ api:'batch', b:B, k:K }).then(j => start(j.data)).catch(e => {
  app.innerHTML = '<div class="fejl">Annoncerne kunne ikke hentes. Tjek din forbindelse, og genindlæs siden.</div>';
});

function start(data) {
  D = data;
  D.grupper.forEach((g, gi) => g.annoncer.forEach(a => alle.push(Object.assign({}, a, { gi, g }))));
  Object.keys(D.svar || {}).forEach(fil => {
    const v = SERVER[D.svar[fil].beslutning];
    if (v) { svar[fil] = { beslutning:v, rettelse:D.svar[fil].rettelse || '' }; sendt[fil] = JSON.stringify(svar[fil]); }
  });
  try { const gemt = JSON.parse(localStorage.getItem(LAGER) || '{}'); Object.assign(svar, gemt); } catch (e) {}
  const foerste = alle.findIndex(a => !svar[a.fil]);
  pos = foerste < 0 ? 0 : foerste;
  skelet();
  vis();
  document.addEventListener('keydown', taster);
}

function gem() {
  const kladde = {}; Object.keys(svar).forEach(f => { if (JSON.stringify(svar[f]) !== sendt[f]) kladde[f] = svar[f]; });
  try { localStorage.setItem(LAGER, JSON.stringify(kladde)); } catch (e) {}
}

function skelet() {
  app.innerHTML = `
    <header class="top"><div class="ind">
        <img class="logo" id="logo" alt="${esc(D.klinik)}" hidden>
        <div class="titel serif" id="titel">${esc(D.klinik)}</div>
        <div class="fremdrift" id="fremdrift"></div>
      </div>
      <nav class="grupper" id="grupper" aria-label="Grupper"></nav>
      <div class="bar"><i id="barfyld"></i></div>
    </header>
    <main id="main"></main>
    <div class="dock" id="dock"><div class="ind">
      <div class="send" id="sendlinje" hidden><span id="sendtekst"></span><button id="sendknap">Send svar</button></div>
      <div class="valg" id="valg">
        <button class="afvis" data-v="afvis">Afvis</button>
        <button class="ret" data-v="ret">Ret</button>
        <button class="godkend" data-v="godkend">Godkend</button>
      </div>
    </div></div>
    <div id="arkholder"></div>`;
  if (D.logo) billede(D.logo, u => { const l = document.getElementById('logo'); l.src = u; l.hidden = false; document.getElementById('titel').hidden = true; });
  document.querySelectorAll('#valg button').forEach(b => b.onclick = () => beslut(b.dataset.v));
  document.getElementById('sendknap').onclick = send;
}

function vis() {
  if (faerdigVist) return visFaerdig();
  const a = alle[pos], g = a.g, s = svar[a.fil];
  const iGruppe = g.annoncer.indexOf(g.annoncer.find(x => x.fil === a.fil));
  document.getElementById('valg').hidden = false; document.getElementById('dock').hidden = false;
  document.getElementById('main').innerHTML = `
    <section class="venstre">
      <div class="hvilken"><h1 class="serif">${esc(g.navn)}</h1><span class="nr">${esc(g.slags)}, nr. ${esc(a.nr)}</span></div>
      <div class="format" role="group" aria-label="Format">
        <button data-f="feed" aria-pressed="${format === 'feed'}">Feed 4:5</button>
        <button data-f="story" aria-pressed="${format === 'story'}">Story 9:16</button>
      </div>
      ${s ? stempel(s) : ''}<div class="scene">${scene(a)}</div>
      <div class="strip" id="strip">${g.annoncer.map((x, i) => {
        const sx = svar[x.fil], gi = alle.findIndex(y => y.fil === x.fil);
        return `<button class="tn" data-i="${gi}" aria-current="${x.fil === a.fil}" aria-label="Nr. ${esc(x.nr)}${sx ? ', ' + NAVN[sx.beslutning] : ''}">
          <span class="r" data-id="${x.feed}"></span>${sx ? `<span class="prik ${sx.beslutning}">${{godkend:'✓',ret:'!',afvis:'×'}[sx.beslutning]}</span>` : ''}<em>${esc(x.nr)}</em></button>`;
      }).join('')}</div>
    </section>
    <section class="info">
      <div class="kort"><h2>Teksten på billedet</h2><ul class="linjer">${g.billedtekst.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
      ${g.opslag ? `<div class="kort"><h2>Tekst over billedet</h2><p class="rolig" style="margin:0">${esc(g.opslag)}</p></div>` : ''}
      <div class="kort rolig"><h2 style="color:var(--tekst)">Godt at vide</h2>
        ${g.aegte ? `<p>${esc(g.aegte)}</p>` : ''}
        <p>Intet går live, før du har godkendt det. Du kan sende dine svar, når du vil, og ændre dem bagefter.</p></div>
      <p class="genvej">Tastatur: <kbd>G</kbd> godkend, <kbd>R</kbd> ret, <kbd>A</kbd> afvis, <kbd>←</kbd> <kbd>→</kbd> skift annonce.</p>
    </section>`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { format = b.dataset.f; vis(); });
  document.querySelectorAll('.tn').forEach(b => { b.onclick = () => { pos = +b.dataset.i; vis(); };
    const r = b.querySelector('.r'); billede(r.dataset.id, u => r.style.backgroundImage = `url("${u}")`); });
  const fortryd = document.getElementById('fortryd'); if (fortryd) fortryd.onclick = () => { delete svar[a.fil]; gem(); vis(); };
  const aendr = document.getElementById('aendr'); if (aendr) aendr.onclick = () => aabnArk(a);
  const id = format === 'story' ? a.story : a.feed;
  billede(id, u => { const el = document.getElementById('hb'); if (el && alle[pos].fil === a.fil) el.src = u; });
  if (D.avatar) billede(D.avatar, u => document.querySelectorAll('img.av').forEach(i => i.src = u));
  const strip = document.getElementById('strip'), cur = strip.querySelector('.tn[aria-current="true"]');
  if (cur) strip.scrollLeft = cur.offsetLeft - strip.offsetLeft - strip.clientWidth / 2 + cur.clientWidth / 2;
  const top = document.querySelector('.top'); if (top) document.documentElement.style.setProperty('--hh', top.offsetHeight + 'px');
  forhent(pos + 1); forhent(pos + 2);
  status();
}

function scene(a) {
  const hoved = navn => `<div class="hoved"><div class="avatar"><img class="av" alt=""></div><div class="hvem"><b>${esc(navn)}</b><span>Sponsoreret</span></div></div>`;
  if (format === 'story') return `<div class="story"><img id="hb" alt="${esc(a.g.navn)} nr. ${esc(a.nr)} i 9:16">${hoved(D.handle)}</div>`;
  return `<div class="post">${hoved(D.handle)}<img class="billede" id="hb" alt="${esc(a.g.navn)} nr. ${esc(a.nr)} i 4:5"><div class="cta"><span>Book nu</span><span>›</span></div></div>`;
}

function stempel(s) {
  return `<div class="stempel ${s.beslutning}"><b>${NAVN[s.beslutning]}</b>
    <span class="t">${s.rettelse ? esc(s.rettelse) : ''}</span>
    ${s.beslutning === 'ret' ? '<button id="aendr">Ændr</button>' : ''}<button id="fortryd">Fortryd</button></div>`;
}

function beslut(v) {
  const a = alle[pos];
  if (v === 'ret') return aabnArk(a);
  svar[a.fil] = { beslutning:v, rettelse:'' };
  gem();
  toast(v === 'godkend' ? 'Godkendt' : 'Afvist');
  videre();
}

function videre() {
  const n = alle.length;
  for (let i = 1; i <= n; i++) { const j = (pos + i) % n; if (!svar[alle[j].fil]) { pos = j; return vis(); } }
  faerdigVist = true; vis();
}

function aabnArk(a) {
  const s = svar[a.fil] && svar[a.fil].beslutning === 'ret' ? svar[a.fil].rettelse : '';
  let chipDel = '', tekstDel = s;
  const m = s.match(/^([^:]+):\s*([\s\S]*)$/);
  const erChips = x => x.split(', ').every(c => RET_CHIPS.includes(c));
  if (m && erChips(m[1])) { chipDel = m[1]; tekstDel = m[2]; }
  else if (s && erChips(s)) { chipDel = s; tekstDel = ''; }
  const valgte = new Set(chipDel ? chipDel.split(', ') : []);
  const holder = document.getElementById('arkholder');
  holder.innerHTML = `<div class="skygge" id="skygge"></div>
    <div class="ark" role="dialog" aria-modal="true" aria-labelledby="arktitel">
      <h2 class="serif" id="arktitel">Hvad skal rettes?</h2>
      <div class="hvad">${esc(a.g.navn)}, ${esc(a.g.slags.toLowerCase())}, nr. ${esc(a.nr)}</div>
      <div class="chips">${RET_CHIPS.map(c => `<button data-c="${c}" aria-pressed="${valgte.has(c)}">${c}</button>`).join('')}</div>
      <textarea id="rettekst" placeholder="Skriv kort, hvad der skal ændres. Fx: gør lyset varmere, eller prisen skal stå større.">${esc(tekstDel)}</textarea>
      <div class="knapper"><button id="annuller">Annuller</button><button class="gem" id="gemret">Gem rettelse</button></div>
    </div>`;
  const ta = document.getElementById('rettekst'), gemknap = document.getElementById('gemret');
  const opdater = () => { gemknap.disabled = !ta.value.trim() && !holder.querySelector('[aria-pressed="true"]'); };
  holder.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); opdater(); });
  ta.oninput = opdater; opdater();
  const luk = () => { holder.innerHTML = ''; };
  document.getElementById('annuller').onclick = luk; document.getElementById('skygge').onclick = luk;
  gemknap.onclick = () => {
    const chips = [...holder.querySelectorAll('[aria-pressed="true"]')].map(b => b.dataset.c);
    const tekst = ta.value.trim();
    svar[a.fil] = { beslutning:'ret', rettelse:(chips.length ? chips.join(', ') + (tekst ? ': ' : '') : '') + tekst };
    gem(); luk(); toast('Rettelse gemt'); videre();
  };
  setTimeout(() => ta.focus(), 50);
}

function aendringer() { return Object.keys(svar).filter(f => JSON.stringify(svar[f]) !== sendt[f]); }

function status() {
  const besvaret = alle.filter(a => svar[a.fil]).length;
  document.getElementById('fremdrift').textContent = `${besvaret} af ${alle.length} gennemgået`;
  document.getElementById('barfyld').style.width = (100 * besvaret / alle.length) + '%';
  document.getElementById('grupper').innerHTML = D.grupper.map((g, gi) => {
    const n = g.annoncer.filter(a => svar[a.fil]).length;
    return `<button class="gruppe" data-g="${gi}" aria-current="${!faerdigVist && alle[pos].gi === gi}">${esc(g.navn)}, ${esc(g.slags.toLowerCase())}<small>${n}/${g.annoncer.length}</small></button>`;
  }).join('');
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const gi = +b.dataset.g; const i = alle.findIndex(a => a.gi === gi && !svar[a.fil]);
    pos = i >= 0 ? i : alle.findIndex(a => a.gi === gi); faerdigVist = false; vis(); window.scrollTo({ top:0 });
  });
  const nye = aendringer().length;
  document.getElementById('sendlinje').hidden = !nye || faerdigVist;
  document.getElementById('sendtekst').textContent = `${nye} ${nye === 1 ? 'svar' : 'svar'} ikke sendt endnu`;
  document.getElementById('sendknap').textContent = `Send ${nye} svar`;
}

function visFaerdig() {
  const t = v => alle.filter(a => svar[a.fil] && svar[a.fil].beslutning === v).length;
  const nye = aendringer().length, mangler = alle.filter(a => !svar[a.fil]).length;
  document.getElementById('valg').hidden = true; document.getElementById('dock').hidden = true;
  document.getElementById('main').innerHTML = `<section class="faerdig" style="grid-column:1/-1;max-width:560px">
    <h1 class="serif">${mangler ? 'Næsten færdig' : 'Du har set dem alle'}</h1>
    <p class="rolig" style="margin:0">${nye ? 'Tryk på knappen, så får vi dine svar og går i gang med det samme.' : 'Dine svar er sendt. Du kan stadig åbne en annonce og ændre dit svar.'}</p>
    <div class="tal"><div class="godkend"><b>${t('godkend')}</b>godkendt</div><div class="ret"><b>${t('ret')}</b>rettes</div><div class="afvis"><b>${t('afvis')}</b>afvist</div></div>
    ${mangler ? `<p class="rolig">${mangler} annoncer mangler stadig et svar. Vælg en gruppe øverst for at se dem.</p>` : ''}
    ${nye ? `<button class="sendstor" id="sendstor" style="width:100%;border:0;background:var(--moerk);color:#fff;font-weight:650;border-radius:14px;padding:15px;font-size:16px">Send ${nye} svar</button>` : ''}
    <button id="igen" style="margin-top:14px;border:0;background:none;text-decoration:underline;color:var(--daempet);padding:0">Se annoncerne igen</button>
  </section>`;
  const sb = document.getElementById('sendstor'); if (sb) sb.onclick = send;
  document.getElementById('igen').onclick = () => { faerdigVist = false; pos = 0; vis(); window.scrollTo({ top:0 }); };
  status();
}

function send() {
  const knapper = [document.getElementById('sendknap'), document.getElementById('sendstor')].filter(Boolean);
  const liste = aendringer().map(fil => { const a = alle.find(x => x.fil === fil);
    return { gruppe:`${a.g.navn}, ${a.g.slags.toLowerCase()}`, nr:a.nr, fil, beslutning:svar[fil].beslutning, rettelse:svar[fil].rettelse }; });
  if (!liste.length) return;
  knapper.forEach(k => { k.disabled = true; k.textContent = 'Sender…'; });
  post({ action:'svar', b:B, k:K, liste }).then(() => {
    liste.forEach(s => sendt[s.fil] = JSON.stringify(svar[s.fil])); gem();
    toast(`${liste.length} svar sendt. Tak.`); vis();
  }).catch(() => {
    knapper.forEach(k => k.disabled = false); status();
    toast('Svarene blev ikke sendt. Tjek din forbindelse, og prøv igen.');
    const sb = document.getElementById('sendstor'); if (sb) sb.textContent = 'Prøv igen';
  });
}

let tt;
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('vis'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('vis'), 1600); }

function taster(e) {
  if (document.getElementById('arkholder').innerHTML) { if (e.key === 'Escape') document.getElementById('arkholder').innerHTML = ''; return; }
  if (e.target.closest('textarea, input')) return;
  if (faerdigVist && !['ArrowLeft','ArrowRight'].includes(e.key)) return;
  const k = e.key.toLowerCase();
  if (k === 'g') beslut('godkend'); else if (k === 'r') beslut('ret'); else if (k === 'a') beslut('afvis');
  else if (e.key === 'ArrowRight') { faerdigVist = false; pos = (pos + 1) % alle.length; vis(); }
  else if (e.key === 'ArrowLeft') { faerdigVist = false; pos = (pos - 1 + alle.length) % alle.length; vis(); }
}
</script>
